# Local development stack.
#
#   docker compose up
#
# Brings up the API, the React frontend and PostgreSQL. Ollama is expected on
# the host (see README) and reached via host.docker.internal; the API degrades
# to extraction-and-search-only if it is not running, rather than failing.
#
# Optional monitoring stack:  docker compose --profile observability up

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: ${DOCKER_BUILD_TARGET:-development}
    container_name: roneira-api
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-true}
      # asyncpg is in requirements.txt; without it this URL fails at startup
      # with "the asyncio extension requires an async driver".
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-document_intelligence}
      SECRET_KEY: ${SECRET_KEY:-local-development-secret-key-change-me-0123456789}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      UPLOAD_DIRECTORY: /app/uploads
      VECTOR_STORE_PATH: /app/chroma_db
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    volumes:
      # Source is mounted for hot reload in the development target. The named
      # volumes keep uploads and the vector index out of the bind mount so
      # they survive a rebuild and do not litter the working tree.
      - .:/app
      - api_uploads:/app/uploads
      - api_vectors:/app/chroma_db
    depends_on:
      postgres:
        condition: service_healthy
    networks: [roneira]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: roneira-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    networks: [roneira]

  postgres:
    image: postgres:16-alpine
    container_name: roneira-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-document_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Deliberately not published to the host: a database reachable on
    # 0.0.0.0:5432 with a default password is the most common way a
    # development stack gets compromised. Uncomment for direct psql access.
    # ports:
    #   - "5432:5432"
    networks: [roneira]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Observability (optional profile) -----------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: roneira-prometheus
    profiles: [observability]
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./deployment/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [roneira]

  grafana:
    image: grafana/grafana:latest
    container_name: roneira-grafana
    profiles: [observability]
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deployment/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./deployment/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on: [prometheus]
    networks: [roneira]

networks:
  roneira:
    driver: bridge

volumes:
  postgres_data:
  api_uploads:
  api_vectors:
  prometheus_data:
  grafana_data:
