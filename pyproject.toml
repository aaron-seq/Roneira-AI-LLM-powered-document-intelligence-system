# Tooling configuration.
#
# Ruff replaces the previous black + isort + flake8 trio: one tool, one config,
# and it runs fast enough that contributors actually run it before pushing.

[tool.ruff]
line-length = 90
target-version = "py311"
extend-exclude = [
    ".venv",
    "node_modules",
    "src",       # research/demo modules, formatted separately
    "app",       # legacy tree, see docs/ARCHITECTURE.md
    "scripts",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # bugbear
    "C4",   # comprehensions
    "ASYNC",# async correctness
    "S",    # bandit-style security checks
    "T20",  # no stray print()
    "RUF",
]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # FastAPI's Depends() in defaults is the documented idiom
    "S104",   # binding 0.0.0.0 is intentional inside a container
    "RUF012", # ClassVar annotations on mutable class attrs; noisy here
]
# Note: the pyupgrade ("UP") rules are deliberately not enabled yet. They flag
# ~770 typing-annotation modernizations across the older service modules;
# applying them in the same change as behavioural fixes would bury the diff.
# Tracked as a standalone cleanup — see the roadmap in README.md.

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = [
    "S101",     # assert is the point of a test
    "S105",     # hard-coded test credentials are not secrets
    "S106",
    "S311",
    "ASYNC230", # tests read small fixture files synchronously on purpose
    "ASYNC240",
]

# Reading local file metadata and small files with the stdlib is fine here:
# these paths touch the local filesystem only, and swapping in anyio.Path
# would add a dependency without changing observable latency. Revisit if
# document storage ever moves behind a network filesystem.
"backend/common/helpers.py" = ["ASYNC230", "ASYNC240"]
"backend/api/routers/documents.py" = ["ASYNC240"]

# Pre-existing findings in modules that predate the stricter rule set. These
# are exemptions to pay down, not licence to write new code this way.
"backend/observability/tracing.py" = ["B039"]
"backend/services/pii_detection_service.py" = ["B007"]
"backend/services/text_splitter_service.py" = ["B007"]
"backend/services/vector_store_service.py" = ["ASYNC240", "E402", "F401"]
"backend/training/data_preparation.py" = ["S311", "S324"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
# `python_version` is deliberately not pinned. Setting it to "3.11" fixed the
# syntax level mypy would accept *anywhere*, including inside third-party
# stubs — and NumPy 2.5 (which pip installs only on Python 3.12+) writes PEP
# 695 `type X = ...` aliases in its own `.pyi`. mypy rejected the stub itself:
#
#   numpy/__init__.pyi:737: error: Type statement is only supported in Python
#   3.12 and greater  [syntax]
#
# Unset, mypy targets the interpreter it runs under. The CI matrix still holds
# the 3.11 floor for our own code, because the 3.11 job type-checks against
# 3.11 semantics.
warn_unused_configs = true
ignore_missing_imports = true
no_strict_optional = true
exclude = ["^(app|src|scripts|tests)/", "^\\.venv/"]
