# Alembic configuration.
#
# The database URL is deliberately absent. `migrations/env.py` reads it from
# `backend.core.config`, so DATABASE_URL is defined in exactly one place and a
# migration can never run against a different database than the application.

[alembic]
script_location = migrations

# Revision filenames are prefixed with the creation date, so `ls versions/`
# reads in the order the migrations were written.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

prepend_sys_path = .

# Timestamps in UTC; a migration history is read across timezones.
timezone = UTC

[post_write_hooks]
# Keep generated migrations to the same formatting as the rest of the tree,
# so `ruff format --check` does not fail the build on an autogenerated file.
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
