[pytest]
minversion = 7.0

# Tests live next to the code they cover. `tests/` at the repo root holds the
# legacy suite for the `src/` research modules and is opted into explicitly
# with `pytest tests/`.
testpaths = backend/tests

# Put the repository root on sys.path so `import backend` resolves regardless
# of how pytest is invoked. `python -m pytest` adds the current directory
# implicitly; the `pytest` console script does not — which is how the suite
# passed locally and failed in CI with "No module named 'backend'".
pythonpath = .

python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -ra
    --strict-markers
    --strict-config
    --cov
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=70

asyncio_mode = auto

markers =
    integration: exercises several components together through the HTTP API
    slow: takes more than a second; excluded from the fast feedback loop

filterwarnings =
    ignore::DeprecationWarning
