[pytest]
minversion = 7.0

# Tests live next to the code they cover. `tests/` at the repo root holds the
# legacy suite for the `src/` research modules and is opted into explicitly
# with `pytest tests/`.
testpaths = backend/tests

python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -ra
    --strict-markers
    --strict-config
    --cov
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=70

asyncio_mode = auto

markers =
    integration: exercises several components together through the HTTP API
    slow: takes more than a second; excluded from the fast feedback loop

filterwarnings =
    ignore::DeprecationWarning
