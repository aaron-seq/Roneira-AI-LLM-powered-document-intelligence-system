# Continuous integration for the code that actually ships.
#
# The previous pipeline linted, type-checked and tested `app/` — a legacy tree
# the running service does not import — while `backend/`, which uvicorn
# serves, was never checked. CI was green while the application could not even
# be imported. Every job below targets `backend/` and the frontend.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

# A new push supersedes an in-flight run for the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  # Vite 7 requires ^20.19 || >=22.12; 22 is the current LTS.
  NODE_VERSION: "22"

jobs:
  # ---------------------------------------------------------------- backend
  backend-quality:
    name: Backend lint & types (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The README promises "Python 3.11+". It was not true: asyncpg 0.29
        # and numpy<2 ship no CPython 3.13 wheels, so `pip install -r
        # requirements.txt` tried to compile them and failed on any machine
        # without a C toolchain. Nothing in CI noticed, because CI only ever
        # installed on 3.11. This matrix is that missing check — it costs one
        # install per version and it is the job that catches the next one.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # ruff and mypy are pinned in requirements.txt. Installing them
          # unpinned here meant CI silently linted with a different version
          # than a developer has locally.
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check backend/

      - name: Format check (ruff)
        run: ruff format --check backend/

      - name: Type check (mypy)
        # --follow-imports=silent keeps the gate on the packages named here
        # without failing on the older service modules they import, which are
        # not annotated yet. Widen this list as those are cleaned up.
        run: |
          mypy backend/core backend/api backend/repositories \
               --ignore-missing-imports --no-strict-optional --follow-imports=silent

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      # OCR needs the tesseract binary, which pip cannot provide. Without it
      # the scanned-document tests skip, and the feature would ship untested.
      - name: Install tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          ENVIRONMENT: test
          SECRET_KEY: ci-secret-key-not-used-outside-github-actions-0123456789
          DATABASE_URL: sqlite+aiosqlite:///./ci-test.db
        run: pytest -v

      # `tests/` covers the research modules under `src/` (data catalog,
      # synthetic data, ontology, evaluation). They were outside testpaths and
      # so had never run in CI — 131 tests that could rot unnoticed. Coverage
      # is disabled here because the gate is calibrated for `backend/`.
      - name: Run the src/ research module tests
        env:
          ENVIRONMENT: test
          SECRET_KEY: ci-secret-key-not-used-outside-github-actions-0123456789
        run: pytest tests/ -v --no-cov

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: coverage.xml
          retention-days: 7
          if-no-files-found: warn

  # Proves the documented quick start works on a clean machine. This is the
  # check that would have caught the broken import: the app is started for
  # real and its health endpoint is polled.
  smoke-test:
    name: Smoke test (app boots and serves)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Server and assertions live in ONE step: each GitHub Actions step runs
      # in its own shell, and a process backgrounded in one step is not
      # reliably alive in the next.
      - name: Boot the app and drive a document end to end
        env:
          ENVIRONMENT: development
          SECRET_KEY: smoke-test-secret-key-0123456789abcdefghij
          DATABASE_URL: sqlite+aiosqlite:///./smoke.db
        run: |
          set -euo pipefail

          uvicorn backend.main:app --host 127.0.0.1 --port 8000 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health/live > /dev/null 2>&1; then
              echo "API live after ${attempt}s"
              break
            fi
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "The server exited during startup"
              exit 1
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:8000/api/health/live > /dev/null

          TOKEN=$(curl -fsS -X POST http://127.0.0.1:8000/api/auth/token \
            -d "username=demo&password=demo" \
            | python -c "import sys,json; print(json.load(sys.stdin)['access_token'])")

          echo "Sample invoice for ACME Corporation, total 1200 USD." > sample.txt
          DOC_ID=$(curl -fsS -X POST http://127.0.0.1:8000/api/documents/upload \
            -H "Authorization: Bearer $TOKEN" -F "file=@sample.txt" \
            | python -c "import sys,json; print(json.load(sys.stdin)['document_id'])")

          STATUS=queued
          for _ in $(seq 1 60); do
            STATUS=$(curl -fsS "http://127.0.0.1:8000/api/documents/$DOC_ID/status" \
              -H "Authorization: Bearer $TOKEN" \
              | python -c "import sys,json; print(json.load(sys.stdin)['status'])")
            [ "$STATUS" = "completed" ] && break
            [ "$STATUS" = "failed" ] && { echo "Processing failed"; exit 1; }
            sleep 1
          done
          [ "$STATUS" = "completed" ] || { echo "Timed out in state $STATUS"; exit 1; }

          # The document must be findable. This is the guarantee that broke
          # when the upload pipeline and chat held separate vector stores.
          HITS=$(curl -fsS -X POST http://127.0.0.1:8000/api/search \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d '{"query":"ACME invoice total","top_k":5,"min_score":0.0}' \
            | python -c "import sys,json; print(json.load(sys.stdin)['total_results'])")
          echo "Search returned $HITS result(s)"
          [ "$HITS" -gt 0 ] || { echo "Indexed document was not retrievable"; exit 1; }

          # An unauthenticated request must be refused.
          CODE=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/documents)
          [ "$CODE" = "401" ] || { echo "Expected 401 without a token, got $CODE"; exit 1; }

          curl -fsS http://127.0.0.1:8000/api/metrics | head -3
          echo "Smoke test passed"

  # --------------------------------------------------------------- frontend
  frontend:
    name: Frontend build & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # --------------------------------------------------------------- security
  security:
    name: Security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install scanners
        run: pip install bandit pip-audit

      - name: Static analysis (bandit)
        run: bandit -r backend/ -ll -x backend/tests

      - name: Dependency audit (pip-audit)
        # Advisory: a new CVE in a transitive dependency should not block an
        # unrelated pull request, but it must be visible in the run.
        continue-on-error: true
        run: pip-audit --requirement requirements.txt --strict

  # ------------------------------------------------------------------ image
  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [backend-tests]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: false
          load: true
          tags: roneira-document-intelligence:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the image serves health
        run: |
          docker run -d --name roneira-ci -p 8000:8000 \
            -e SECRET_KEY=docker-ci-secret-key-0123456789abcdefghij \
            -e ENVIRONMENT=development \
            roneira-document-intelligence:ci
          # The first boot downloads the sentence-transformers model (~90MB)
          # inside the lifespan, before anything is served — so nothing answers
          # until that finishes. Thirty seconds was not enough on a cold cache,
          # and this job only ever ran green because it was skipped behind the
          # failing test job.
          for attempt in $(seq 1 180); do
            if curl -fsS http://127.0.0.1:8000/api/health/live > /dev/null; then
              echo "Container is healthy after ${attempt}s"
              docker rm -f roneira-ci
              exit 0
            fi
            if ! docker ps -q --filter name=roneira-ci --filter status=running | grep -q .; then
              echo "Container exited during startup. Logs:"
              docker logs roneira-ci
              docker rm -f roneira-ci
              exit 1
            fi
            sleep 1
          done
          echo "Container never became healthy. Logs:"
          docker logs roneira-ci
          docker rm -f roneira-ci
          exit 1
