# Continuous integration for the code that actually ships.
#
# The previous pipeline linted, type-checked and tested `app/` — a legacy tree
# the running service does not import — while `backend/`, which uvicorn
# serves, was never checked. CI was green while the application could not even
# be imported. Every job below targets `backend/` and the frontend.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

# A new push supersedes an in-flight run for the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ---------------------------------------------------------------- backend
  backend-quality:
    name: Backend lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy

      - name: Lint (ruff)
        run: ruff check backend/

      - name: Format check (ruff)
        run: ruff format --check backend/

      - name: Type check (mypy)
        # Not yet clean across the whole tree; enforced on the modules that
        # carry the request path, and expanded as the rest is annotated.
        run: |
          mypy backend/core backend/api backend/repositories \
               --ignore-missing-imports --no-strict-optional

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          ENVIRONMENT: test
          SECRET_KEY: ci-secret-key-not-used-outside-github-actions-0123456789
          DATABASE_URL: sqlite+aiosqlite:///./ci-test.db
        run: pytest -v

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: coverage.xml
          retention-days: 7
          if-no-files-found: warn

  # Proves the documented quick start works on a clean machine. This is the
  # check that would have caught the broken import: the app is started for
  # real and its health endpoint is polled.
  smoke-test:
    name: Smoke test (app boots and serves)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start the API
        env:
          ENVIRONMENT: development
          SECRET_KEY: smoke-test-secret-key-0123456789abcdefghij
          DATABASE_URL: sqlite+aiosqlite:///./smoke.db
        run: |
          uvicorn backend.main:app --host 127.0.0.1 --port 8000 &
          echo $! > uvicorn.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health/live > /dev/null; then
              echo "API is live after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "API failed to become live within 30s"
          exit 1

      - name: Exercise the documented workflow
        env:
          SECRET_KEY: smoke-test-secret-key-0123456789abcdefghij
        run: |
          set -euo pipefail

          TOKEN=$(curl -fsS -X POST http://127.0.0.1:8000/api/auth/token \
            -d "username=demo&password=demo" | python -c "import sys,json; print(json.load(sys.stdin)['access_token'])")

          echo "Sample invoice for ACME Corporation, total 1200 USD." > sample.txt
          DOC_ID=$(curl -fsS -X POST http://127.0.0.1:8000/api/documents/upload \
            -H "Authorization: Bearer $TOKEN" -F "file=@sample.txt" \
            | python -c "import sys,json; print(json.load(sys.stdin)['document_id'])")

          for _ in $(seq 1 30); do
            STATUS=$(curl -fsS "http://127.0.0.1:8000/api/documents/$DOC_ID/status" \
              -H "Authorization: Bearer $TOKEN" \
              | python -c "import sys,json; print(json.load(sys.stdin)['status'])")
            [ "$STATUS" = "completed" ] && break
            [ "$STATUS" = "failed" ] && { echo "Processing failed"; exit 1; }
            sleep 1
          done
          [ "$STATUS" = "completed" ] || { echo "Timed out in state $STATUS"; exit 1; }

          # The document must be findable — this is the end-to-end guarantee.
          HITS=$(curl -fsS -X POST http://127.0.0.1:8000/api/search \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d '{"query":"ACME invoice total","top_k":5,"min_score":0.0}' \
            | python -c "import sys,json; print(json.load(sys.stdin)['total_results'])")
          echo "Search returned $HITS result(s)"
          [ "$HITS" -gt 0 ] || { echo "Indexed document was not retrievable"; exit 1; }

          curl -fsS http://127.0.0.1:8000/api/metrics | head -5

      - name: Stop the API
        if: always()
        run: kill "$(cat uvicorn.pid)" 2>/dev/null || true

  # --------------------------------------------------------------- frontend
  frontend:
    name: Frontend build & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # --------------------------------------------------------------- security
  security:
    name: Security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install scanners
        run: pip install bandit pip-audit

      - name: Static analysis (bandit)
        run: bandit -r backend/ -ll -x backend/tests

      - name: Dependency audit (pip-audit)
        # Advisory: a new CVE in a transitive dependency should not block an
        # unrelated pull request, but it must be visible in the run.
        continue-on-error: true
        run: pip-audit --requirement requirements.txt --strict

  # ------------------------------------------------------------------ image
  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [backend-tests]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: false
          load: true
          tags: roneira-document-intelligence:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the image serves health
        run: |
          docker run -d --name roneira-ci -p 8000:8000 \
            -e SECRET_KEY=docker-ci-secret-key-0123456789abcdefghij \
            -e ENVIRONMENT=development \
            roneira-document-intelligence:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health/live > /dev/null; then
              echo "Container is healthy"
              docker rm -f roneira-ci
              exit 0
            fi
            sleep 1
          done
          echo "Container never became healthy. Logs:"
          docker logs roneira-ci
          docker rm -f roneira-ci
          exit 1
