# nginx config for the frontend container.
#
# This lived inline in Dockerfile.frontend as a single `echo` with backslash
# continuations, which is how its `proxy_pass` came to name a backend service
# (`app`) that docker-compose does not define — the service is `api`. Every
# /api request from the containerised frontend failed to resolve. A real file
# is reviewable and testable with `nginx -t`.

upstream backend {
    # Must match the docker-compose service name for the API.
    server api:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads go through this proxy, so the default 1MB body limit would
    # reject documents the API itself accepts.
    client_max_body_size 64m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed asset filenames are immutable; index.html must never be cached or
    # a deploy leaves browsers loading a stale bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /api {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Document processing streams progress over a WebSocket.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Uploading and processing a large PDF outlasts the 60s default.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Client-side routing: unknown paths are React Router's, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
