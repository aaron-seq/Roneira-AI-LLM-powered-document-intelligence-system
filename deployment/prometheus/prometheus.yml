# Scrape configuration for the local observability profile.
#
# The repository already shipped a Grafana dashboard, but nothing exposed or
# scraped metrics, so every panel was empty. The API now serves
# /api/metrics and this tells Prometheus where to find it.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: roneira-api
    metrics_path: /api/metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: roneira

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
